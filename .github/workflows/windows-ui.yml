name: Windows UI regression
on:
  push:
    paths:
      - 'ImageForge.App/**'
      - 'ImageForge.Core/**'
      - 'ImageForge.Core.Tests/**'
      - 'ImageForge.Ui.Tests/**'
      - '.github/workflows/windows-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-ui:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Core regressions
        run: dotnet run --project ImageForge.Core.Tests -c Release
      - name: Extracted-media import and WPF render
        run: dotnet run --project ImageForge.Ui.Tests -c Release
      - name: Keep runtime report and actual window renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui
          path: artifacts/windows-ui
          if-no-files-found: warn
